<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>دفتر حساب آرایشگاه</title>
<style>
  :root{
    --charcoal:#1E1B16; --panel:#28221A; --border:#3A3226; --paper:#F3EAD6;
    --brass:#C7A344; --pine:#4F6F52; --red:#B23A48;
    --ink:#2A241C; --muted:#9A8F76; --muted2:#B8AD96;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--charcoal); color:var(--paper);
    font-family:'Vazirmatn','Tahoma','Segoe UI',sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button{ font-family:inherit; cursor:pointer; }
  input{ font-family:inherit; }
  .container{ max-width:460px; margin:0 auto; padding:20px 16px 100px; }
  .eyebrow{ color:var(--brass); font-size:12.5px; font-weight:700; letter-spacing:.5px; margin-bottom:2px; }
  .title{ font-size:22px; font-weight:800; }
  .stripe{
    height:5px; border-radius:999px; margin:14px 0 18px; opacity:.85;
    background:repeating-linear-gradient(-45deg, var(--red) 0 10px, var(--paper) 10px 20px, var(--brass) 20px 30px);
  }
  .ticket{
    background:var(--paper); color:var(--ink); border-radius:16px; padding:18px 18px 16px;
    box-shadow:0 10px 26px rgba(0,0,0,.35); margin-bottom:16px;
  }
  .ticket-eyebrow{ font-size:12.5px; font-weight:700; color:#8B6B1F; margin-bottom:10px; }
  .stat-row{ display:flex; align-items:flex-end; justify-content:space-between; }
  .big-num{ font-size:42px; font-weight:900; line-height:1; }
  .big-num-sm{ font-size:24px; font-weight:900; line-height:1.2; }
  .stat-label{ font-size:12.5px; color:#6B6250; margin-top:4px; font-weight:600; }
  .perf{ border-bottom:2px dashed #C9BFA6; margin:14px -18px; }
  .avg-line{ font-size:12.5px; color:#6B6250; margin-top:12px; }
  .chip{ border-radius:999px; padding:5px 11px; font-size:13px; font-weight:700; white-space:nowrap; }
  .chip.small{ padding:3px 9px; font-size:12px; }
  .chip.up{ background:rgba(79,111,82,.18); color:#3F6B43; }
  .chip.down{ background:rgba(178,58,72,.18); color:#8C2C38; }
  .chip.flat{ background:rgba(199,163,68,.15); color:#8B6B1F; }
  .card{ background:var(--panel); border-radius:14px; padding:16px; margin-bottom:14px; border:1px solid var(--border); }
  .card-head{ display:flex; align-items:center; justify-content:space-between; }
  .card-title{ font-size:14.5px; font-weight:800; color:var(--paper); }
  .toggle-group{ display:flex; gap:4px; background:var(--charcoal); border-radius:999px; padding:3px; }
  .toggle-btn{ border:none; border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:700; background:transparent; color:var(--muted2); transition:all .15s ease; }
  .toggle-btn.active{ background:var(--brass); color:var(--charcoal); }
  .chart-wrap{ margin-top:14px; }
  .chart-bars{ display:flex; align-items:flex-end; gap:6px; height:150px; padding:0 2px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; position:relative; }
  .bar{ width:100%; border-radius:5px 5px 0 0; min-height:2px; transition:height .4s ease; }
  .bar-label{ font-size:9.5px; color:var(--muted2); margin-top:6px; white-space:nowrap; }
  .bar-tooltip{
    position:absolute; bottom:100%; margin-bottom:4px; background:var(--ink); color:var(--paper);
    font-size:10px; padding:3px 6px; border-radius:5px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s;
    left:50%; transform:translateX(-50%); z-index:5;
  }
  .bar-col:active .bar-tooltip, .bar-col:hover .bar-tooltip{ opacity:1; }
  .report-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .report-box{ background:var(--charcoal); border-radius:10px; padding:12px 10px; text-align:center; }
  .report-box-label{ font-size:11.5px; color:var(--muted); margin-bottom:4px; font-weight:600; }
  .report-box-val{ font-size:16.5px; font-weight:800; margin-bottom:6px; }
  .bw-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .bw-box{ border-radius:10px; padding:10px; }
  .bw-box.best{ background:rgba(79,111,82,.12); border:1px solid rgba(79,111,82,.35); }
  .bw-box.worst{ background:rgba(178,58,72,.12); border:1px solid rgba(178,58,72,.35); }
  .bw-label{ font-size:11.5px; margin-bottom:3px; }
  .bw-val{ font-size:12.5px; font-weight:700; }
  .bw-sub{ font-size:11.5px; color:var(--muted2); margin-top:2px; }
  .empty-state{ font-size:13px; color:var(--muted); margin-top:10px; line-height:1.8; }
  .history-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); }
  .history-date{ font-size:12.5px; color:var(--muted2); margin-bottom:3px; }
  .history-date span{ color:#8B7355; }
  .history-amount{ font-size:14.5px; font-weight:700; cursor:pointer; }
  .history-edit-input{ font-size:14.5px; font-weight:700; background:var(--charcoal); color:var(--paper); border:1px solid var(--brass); border-radius:6px; padding:2px 8px; width:120px; }
  .delete-btn{ background:transparent; border:none; color:#8B7355; font-size:15px; padding:6px; }
  .total-all-time{ font-size:12px; color:var(--muted); margin-top:10px; text-align:center; }
  .data-btn-row{ display:flex; gap:8px; margin-top:10px; margin-bottom:10px; }
  .data-btn{ flex:1; background:var(--charcoal); color:var(--paper); border:1px solid #4a4130; border-radius:10px; padding:10px 8px; font-size:12.5px; font-weight:700; }
  .danger-ghost{ width:100%; background:transparent; color:#B2707A; border:1px solid #4a3030; border-radius:10px; padding:9px 8px; font-size:12.5px; font-weight:700; }
  .confirm-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .danger-btn{ background:var(--red); color:var(--paper); border:none; border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:700; }
  .cancel-btn{ background:transparent; color:var(--muted2); border:1px solid #4a4130; border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:700; }
  .fab{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--brass); color:var(--charcoal); border:none; border-radius:999px;
    padding:14px 26px; font-size:15px; font-weight:800; box-shadow:0 8px 22px rgba(199,163,68,.4); z-index:20;
  }
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; z-index:30; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--paper); color:var(--ink); width:100%; max-width:460px; border-radius:18px 18px 0 0; padding:22px 20px 26px; }
  .modal-title{ font-size:17px; font-weight:800; }
  .modal-sub{ font-size:12.5px; color:#8B6B1F; margin-top:3px; margin-bottom:16px; font-weight:600; }
  .modal-label{ font-size:12.5px; font-weight:700; color:#6B6250; display:block; margin-bottom:6px; }
  .modal-input{ width:100%; padding:12px 14px; font-size:16px; border-radius:10px; border:1.5px solid #C9BFA6; background:#FFFDF8; color:var(--ink); margin-bottom:18px; font-weight:700; }
  .modal-btn-row{ display:flex; gap:10px; }
  .modal-confirm{ flex:1; background:var(--brass); color:var(--charcoal); border:none; border-radius:10px; padding:13px 8px; font-size:14.5px; font-weight:800; }
  .modal-cancel{ flex:1; background:transparent; color:#6B6250; border:1.5px solid #C9BFA6; border-radius:10px; padding:13px 8px; font-size:14.5px; font-weight:700; }
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700; box-shadow:0 6px 18px rgba(0,0,0,.4);
    z-index:40; opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; }
  ::selection{ background:var(--brass); color:var(--charcoal); }
</style>
</head>
<body>

<div class="container">
  <div>
    <div class="eyebrow">دفتر حساب</div>
    <div class="title">مشتری و درآمد آرایشگاه</div>
  </div>
  <div class="stripe"></div>

  <!-- Hero ticket -->
  <div class="ticket">
    <div class="ticket-eyebrow" id="ticketEyebrow"></div>
    <div class="stat-row">
      <div>
        <div class="big-num" id="currCount"></div>
        <div class="stat-label">مشتری این ماه</div>
      </div>
      <span class="chip" id="countChip"></span>
    </div>
    <div class="perf"></div>
    <div class="stat-row">
      <div>
        <div class="big-num-sm" id="currRevenue"></div>
        <div class="stat-label">درآمد این ماه</div>
      </div>
      <span class="chip" id="revChip"></span>
    </div>
    <div class="avg-line">میانگین به ازای هر مشتری: <b id="avgVal"></b></div>
  </div>

  <!-- Chart -->
  <div class="card">
    <div class="card-head">
      <div class="card-title">روند ۱۲ ماه اخیر</div>
      <div class="toggle-group">
        <button class="toggle-btn active" id="btnChartCount" onclick="setChartMode('count')">مشتری</button>
        <button class="toggle-btn" id="btnChartRevenue" onclick="setChartMode('revenue')">درآمد</button>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="chart-bars" id="chartBars"></div>
    </div>
  </div>

  <!-- Reports -->
  <div class="card">
    <div class="card-title">گزارش</div>
    <div class="toggle-group" style="margin-top:10px; margin-bottom:12px;">
      <button class="toggle-btn active" id="btnRepMonth" onclick="setReportTab('month')">ماهانه</button>
      <button class="toggle-btn" id="btnRepQuarter" onclick="setReportTab('quarter')">۳ ماهه</button>
      <button class="toggle-btn" id="btnRepHalf" onclick="setReportTab('half')">۶ ماهه</button>
    </div>
    <div class="report-grid">
      <div class="report-box">
        <div class="report-box-label">مجموع مشتری</div>
        <div class="report-box-val" id="repCount"></div>
        <span class="chip small" id="repCountChip"></span>
      </div>
      <div class="report-box">
        <div class="report-box-label">مجموع درآمد</div>
        <div class="report-box-val" id="repRevenue"></div>
        <span class="chip small" id="repRevChip"></span>
      </div>
    </div>
    <div class="bw-row">
      <div class="bw-box best">
        <div class="bw-label">🟢 بهترین ماه</div>
        <div class="bw-val" id="bestMonth"></div>
        <div class="bw-sub" id="bestMonthVal"></div>
      </div>
      <div class="bw-box worst">
        <div class="bw-label">🔴 ضعیف‌ترین ماه</div>
        <div class="bw-val" id="worstMonth"></div>
        <div class="bw-sub" id="worstMonthVal"></div>
      </div>
    </div>
  </div>

  <!-- History -->
  <div class="card">
    <div class="card-title">ثبت‌های اخیر</div>
    <div id="historyList"></div>
    <div class="total-all-time" id="totalAllTime"></div>
  </div>

  <!-- Data controls -->
  <div class="card">
    <div class="card-title">مدیریت اطلاعات</div>
    <div class="data-btn-row">
      <button class="data-btn" onclick="exportJson()">خروجی JSON</button>
      <button class="data-btn" onclick="document.getElementById('fileInput').click()">وارد کردن JSON</button>
      <input type="file" id="fileInput" accept="application/json" style="display:none" onchange="importJson(event)" />
    </div>
    <div id="clearZone">
      <button class="danger-ghost" onclick="showClearConfirm()">پاک کردن همه اطلاعات</button>
    </div>
  </div>

  <div style="height:20px;"></div>
</div>

<button class="fab" onclick="openModal()">+ ثبت مشتری جدید</button>

<div class="overlay" id="overlay" onclick="closeModalOutside(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">مشتری جدید</div>
    <div class="modal-sub" id="modalSub"></div>
    <label class="modal-label">مبلغ دریافتی (تومان)</label>
    <input class="modal-input" id="amountInput" type="number" inputmode="numeric" placeholder="مثلاً 350000" />
    <div class="modal-btn-row">
      <button class="modal-confirm" onclick="confirmAdd()">ثبت شد</button>
      <button class="modal-cancel" onclick="closeModal()">انصراف</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- Jalali calendar conversion (verified) ---------------- */
function jdiv(a,b){ return Math.trunc(a/b); }
function jmod(a,b){ return a - Math.trunc(a/b)*b; }
function jalCal(jy){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=breaks.length, gy=jy+621, leapJ=-14, jp=breaks[0], jump;
  var leap,n,i;
  for(i=1;i<bl;i++){
    var jm=breaks[i]; jump=jm-jp;
    if(jy<jm) break;
    leapJ=leapJ+jdiv(jump,33)*8+jdiv(jmod(jump,33),4);
    jp=jm;
  }
  n=jy-jp;
  leapJ=leapJ+jdiv(n,33)*8+jdiv(jmod(n,33)+3,4);
  if(jmod(jump,33)===4 && jump-n===4) leapJ+=1;
  var leapG=jdiv(gy,4)-jdiv((jdiv(gy,100)+1)*3,4)-150;
  var march=20+leapJ-leapG;
  if(jump-n<6) n=n-jump+jdiv(jump,33)*33;
  leap=jmod(jmod(n+1,33)-1,4);
  if(leap===-1) leap=4;
  return {leap:leap, gy:gy, march:march};
}
function g2d(gy,gm,gd){
  var d=jdiv((gy+jdiv(gm-8,6)+100100)*1461,4)+jdiv(153*jmod(gm+9,12)+2,5)+gd-34840408;
  d=d-jdiv(jdiv(gy+100100+jdiv(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j=4*jdn+139361631;
  j=j+jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=jdiv(jmod(j,1461),4)*5+308;
  var gd=jdiv(jmod(i,153),5)+1;
  var gm=jmod(jdiv(i,153),12)+1;
  var gy=jdiv(j,1461)-100100+jdiv(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function d2j(jdn){
  var gy=d2g(jdn).gy;
  var jy=gy-621;
  var r=jalCal(jy);
  var jdn1f=g2d(gy,3,r.march);
  var jd,jm,k;
  k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){ jm=1+jdiv(k,31); jd=jmod(k,31)+1; return {jy:jy,jm:jm,jd:jd}; }
    else { k-=186; }
  } else {
    jy-=1; k+=179;
    if(r.leap===1) k+=1;
  }
  jm=7+jdiv(k,30); jd=jmod(k,30)+1;
  return {jy:jy,jm:jm,jd:jd};
}
function gregorianToJalali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function jalaliOf(date){ return gregorianToJalali(date.getFullYear(), date.getMonth()+1, date.getDate()); }

var MONTH_NAMES=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];

/* ---------------- Formatting ---------------- */
function faDigits(n){ return String(n).replace(/[0-9]/g, function(d){ return "۰۱۲۳۴۵۶۷۸۹"[d]; }); }
function fmtInt(n){ return faDigits(Math.round(n).toLocaleString("en-US")); }
function fmtToman(n){ return fmtInt(n) + " تومان"; }
function fmtPct(n){
  if(!isFinite(n)) return "—";
  var sign = n>0 ? "+" : "";
  return faDigits(sign+Math.round(n)) + "٪";
}
function monthKey(jy,jm){ return jy+"-"+jm; }
function lastNMonths(n, todayJ){
  var arr=[]; var jy=todayJ.jy, jm=todayJ.jm;
  for(var i=0;i<n;i++){
    arr.unshift({jy:jy, jm:jm});
    jm-=1;
    if(jm===0){ jm=12; jy-=1; }
  }
  return arr;
}

/* ---------------- State ---------------- */
var STORAGE_KEY = "daftar-hesab-entries";
var entries = [];
var chartMode = "count";
var reportTab = "month";
var editingId = null;

function loadEntries(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) entries = parsed;
    }
  }catch(e){ entries = []; }
}
function saveEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    showToast("ذخیره‌سازی با مشکل مواجه شد");
  }
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ---------------- Modal ---------------- */
function openModal(){
  var today = new Date();
  var j = jalaliOf(today);
  document.getElementById('modalSub').textContent = "امروز: " + faDigits(j.jd) + " " + MONTH_NAMES[j.jm-1] + " " + faDigits(j.jy);
  document.getElementById('amountInput').value = "";
  document.getElementById('overlay').classList.add('open');
  setTimeout(function(){ document.getElementById('amountInput').focus(); }, 50);
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
function closeModalOutside(e){ if(e.target.id === 'overlay') closeModal(); }
function confirmAdd(){
  var amt = Number(document.getElementById('amountInput').value) || 0;
  var now = new Date();
  var j = jalaliOf(now);
  entries.push({
    id: Date.now() + Math.random().toString(36).slice(2,7),
    gDate: now.toISOString(),
    jy: j.jy, jm: j.jm, jd: j.jd,
    hour: now.getHours(), minute: now.getMinutes(),
    amount: amt
  });
  saveEntries();
  closeModal();
  showToast("مشتری ثبت شد ✓");
  render();
}

/* ---------------- Toggles ---------------- */
function setChartMode(mode){
  chartMode = mode;
  document.getElementById('btnChartCount').classList.toggle('active', mode==='count');
  document.getElementById('btnChartRevenue').classList.toggle('active', mode==='revenue');
  render();
}
function setReportTab(tab){
  reportTab = tab;
  document.getElementById('btnRepMonth').classList.toggle('active', tab==='month');
  document.getElementById('btnRepQuarter').classList.toggle('active', tab==='quarter');
  document.getElementById('btnRepHalf').classList.toggle('active', tab==='half');
  render();
}

/* ---------------- Delete / edit entries ---------------- */
function deleteEntry(id){
  entries = entries.filter(function(e){ return e.id !== id; });
  saveEntries();
  render();
}
function startEdit(id){
  editingId = id;
  render();
}
function commitEdit(id, val){
  entries = entries.map(function(e){
    if(e.id === id){ e.amount = Number(val) || 0; }
    return e;
  });
  editingId = null;
  saveEntries();
  render();
}

/* ---------------- Data import/export ---------------- */
function exportJson(){
  var blob = new Blob([JSON.stringify(entries, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var j = jalaliOf(new Date());
  a.href = url;
  a.download = "daftar-hesab-" + j.jy + "-" + j.jm + "-" + j.jd + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("فایل JSON ذخیره شد");
}
function importJson(evt){
  var file = evt.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var parsed = JSON.parse(ev.target.result);
      if(!Array.isArray(parsed)) throw new Error("bad");
      entries = parsed;
      saveEntries();
      showToast("اطلاعات با موفقیت وارد شد");
      render();
    }catch(err){
      showToast("فایل JSON معتبر نیست");
    }
  };
  reader.readAsText(file);
  evt.target.value = "";
}
function showClearConfirm(){
  var zone = document.getElementById('clearZone');
  zone.innerHTML =
    '<div class="confirm-row">' +
      '<span style="color:#E3C6C9; font-size:13px;">مطمئنی؟ این کار قابل بازگشت نیست.</span>' +
      '<div style="display:flex; gap:8px;">' +
        '<button class="danger-btn" onclick="clearAll()">بله، پاک کن</button>' +
        '<button class="cancel-btn" onclick="cancelClear()">انصراف</button>' +
      '</div>' +
    '</div>';
}
function cancelClear(){
  document.getElementById('clearZone').innerHTML = '<button class="danger-ghost" onclick="showClearConfirm()">پاک کردن همه اطلاعات</button>';
}
function clearAll(){
  entries = [];
  saveEntries();
  cancelClear();
  showToast("همه اطلاعات پاک شد");
  render();
}

/* ---------------- Chip helper ---------------- */
function chipHtml(value, small){
  var isUp = value > 0, isDown = value < 0, isInf = !isFinite(value);
  var cls = (isInf || isUp) ? "up" : (isDown ? "down" : "flat");
  var arrow = (isInf || isUp) ? "▲" : (isDown ? "▼" : "•");
  var label = isInf ? "جدید" : fmtPct(value);
  return { cls: cls, text: arrow + " " + label };
}
function setChip(elId, value, small){
  var el = document.getElementById(elId);
  var c = chipHtml(value, small);
  el.className = "chip" + (small ? " small" : "") + " " + c.cls;
  el.textContent = c.text;
}

/* ---------------- Main render ---------------- */
function render(){
  var today = new Date();
  var todayJ = jalaliOf(today);
  var months = lastNMonths(12, todayJ);

  var map = {};
  entries.forEach(function(e){
    var k = monthKey(e.jy, e.jm);
    if(!map[k]) map[k] = {count:0, revenue:0};
    map[k].count += 1;
    map[k].revenue += Number(e.amount) || 0;
  });

  var monthly12 = months.map(function(m){
    var k = monthKey(m.jy, m.jm);
    var d = map[k] || {count:0, revenue:0};
    return {
      jy:m.jy, jm:m.jm,
      label: MONTH_NAMES[m.jm-1].slice(0,3),
      fullLabel: MONTH_NAMES[m.jm-1] + " " + faDigits(m.jy),
      count:d.count, revenue:d.revenue
    };
  });

  var curr = monthly12[monthly12.length-1];
  var prev = monthly12[monthly12.length-2];
  var countPct = prev.count===0 ? (curr.count>0 ? Infinity : 0) : ((curr.count-prev.count)/prev.count)*100;
  var revPct = prev.revenue===0 ? (curr.revenue>0 ? Infinity : 0) : ((curr.revenue-prev.revenue)/prev.revenue)*100;
  var avgPerCustomer = curr.count>0 ? curr.revenue/curr.count : 0;

  document.getElementById('ticketEyebrow').textContent = curr.fullLabel;
  document.getElementById('currCount').textContent = fmtInt(curr.count);
  document.getElementById('currRevenue').textContent = fmtToman(curr.revenue);
  document.getElementById('avgVal').textContent = fmtToman(avgPerCustomer);
  setChip('countChip', countPct, false);
  setChip('revChip', revPct, false);

  /* Chart */
  var maxVal = Math.max.apply(null, monthly12.map(function(m){ return chartMode==='revenue' ? m.revenue : m.count; }).concat([1]));
  var barsHtml = "";
  monthly12.forEach(function(m){
    var val = chartMode==='revenue' ? m.revenue : m.count;
    var pct = Math.max((val/maxVal)*100, val>0 ? 4 : 0);
    var color = chartMode==='revenue' ? 'var(--brass)' : 'var(--pine)';
    var tooltip = chartMode==='revenue' ? fmtToman(val) : fmtInt(val) + ' نفر';
    barsHtml += '<div class="bar-col">' +
      '<div class="bar-tooltip">' + m.fullLabel + ': ' + tooltip + '</div>' +
      '<div class="bar" style="height:' + pct + '%; background:' + color + ';"></div>' +
      '<div class="bar-label">' + m.label + '</div>' +
    '</div>';
  });
  document.getElementById('chartBars').innerHTML = barsHtml;

  /* Reports */
  function periodSum(n){
    var slice = monthly12.slice(monthly12.length - n);
    var prevSlice = monthly12.slice(Math.max(0, monthly12.length - 2*n), monthly12.length - n);
    function sum(arr,key){ return arr.reduce(function(s,m){ return s+m[key]; }, 0); }
    var c = sum(slice,'count'), r = sum(slice,'revenue');
    var pc = sum(prevSlice,'count'), pr = sum(prevSlice,'revenue');
    var cPct = pc===0 ? (c>0?Infinity:0) : ((c-pc)/pc)*100;
    var rPct = pr===0 ? (r>0?Infinity:0) : ((r-pr)/pr)*100;
    var best = slice[0], worst = slice[0];
    slice.forEach(function(m){ if(m.revenue>best.revenue) best=m; if(m.revenue<worst.revenue) worst=m; });
    return {count:c, revenue:r, countPct:cPct, revPct:rPct, best:best, worst:worst};
  }
  var reportData;
  if(reportTab==='month'){
    var best = monthly12[0], worst = monthly12[0];
    monthly12.forEach(function(m){ if(m.revenue>best.revenue) best=m; if(m.revenue<worst.revenue) worst=m; });
    reportData = {count:curr.count, revenue:curr.revenue, countPct:countPct, revPct:revPct, best:best, worst:worst};
  } else if(reportTab==='quarter'){
    reportData = periodSum(3);
  } else {
    reportData = periodSum(6);
  }
  document.getElementById('repCount').textContent = fmtInt(reportData.count);
  document.getElementById('repRevenue').textContent = fmtToman(reportData.revenue);
  setChip('repCountChip', reportData.countPct, true);
  setChip('repRevChip', reportData.revPct, true);
  document.getElementById('bestMonth').textContent = reportData.best.fullLabel;
  document.getElementById('bestMonthVal').textContent = fmtToman(reportData.best.revenue);
  document.getElementById('worstMonth').textContent = reportData.worst.fullLabel;
  document.getElementById('worstMonthVal').textContent = fmtToman(reportData.worst.revenue);

  /* History */
  var recent = entries.slice().sort(function(a,b){ return new Date(b.gDate) - new Date(a.gDate); }).slice(0,12);
  var histHtml = "";
  if(recent.length===0){
    histHtml = '<div class="empty-state">هنوز مشتری‌ای ثبت نشده. با دکمه پایین صفحه شروع کن.</div>';
  } else {
    recent.forEach(function(e){
      var timeStr = faDigits(String(e.hour).padStart(2,'0')) + ":" + faDigits(String(e.minute).padStart(2,'0'));
      var dateStr = faDigits(e.jd) + " " + MONTH_NAMES[e.jm-1];
      if(editingId === e.id){
        histHtml += '<div class="history-row">' +
          '<div>' +
            '<div class="history-date">' + dateStr + ' <span>' + timeStr + '</span></div>' +
            '<input class="history-edit-input" type="number" value="' + e.amount + '" id="editInput_' + e.id + '" ' +
              'onblur="commitEdit(\'' + e.id + '\', this.value)" ' +
              'onkeydown="if(event.key===\'Enter\'){ this.blur(); }" />' +
          '</div>' +
          '<button class="delete-btn" onclick="deleteEntry(\'' + e.id + '\')">✕</button>' +
        '</div>';
      } else {
        histHtml += '<div class="history-row">' +
          '<div>' +
            '<div class="history-date">' + dateStr + ' <span>' + timeStr + '</span></div>' +
            '<div class="history-amount" onclick="startEdit(\'' + e.id + '\')">' + fmtToman(e.amount) + '</div>' +
          '</div>' +
          '<button class="delete-btn" onclick="deleteEntry(\'' + e.id + '\')">✕</button>' +
        '</div>';
      }
    });
  }
  document.getElementById('historyList').innerHTML = histHtml;
  if(editingId){
    var inp = document.getElementById('editInput_' + editingId);
    if(inp){ inp.focus(); inp.select(); }
  }

  var totalAllTime = entries.reduce(function(acc,e){ return {count:acc.count+1, revenue:acc.revenue+(Number(e.amount)||0)}; }, {count:0, revenue:0});
  document.getElementById('totalAllTime').textContent = "مجموع کل از ابتدا: " + fmtInt(totalAllTime.count) + " مشتری، " + fmtToman(totalAllTime.revenue);
}

/* ---------------- Init ---------------- */
loadEntries();
render();
</script>
</body>
</html>
